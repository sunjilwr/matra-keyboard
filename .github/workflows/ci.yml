name: Cross-Platform CI & Installer Packaging

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build & Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MatraSetup-Windows-v1.1.0
            installer_path: dist/MatraSetup-v1.1.0.exe
            pkg_script: powershell -NoProfile -ExecutionPolicy Bypass -Command "& 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss"

          - os: ubuntu-latest
            artifact_name: matra-linux-deb-v1.1.0
            installer_path: dist/matra_1.1.0_amd64.deb
            pkg_script: bash packaging/linux/build_deb.sh

          - os: macos-latest
            artifact_name: Matra-macOS-DMG-v1.1.0
            installer_path: dist/Matra-v1.1.0.dmg
            pkg_script: bash packaging/macos/build_dmg.sh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Native Installer
        run: ${{ matrix.pkg_script }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.installer_path }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
