# ====================================================================
# Matra (মাত্রা) Configuration File (ইউজার কনফিগারেশন)
# ====================================================================

# Language switch shortcut (English <-> Bangla)
# Available options:
#   Ctrl+\       (Recommended - Zero conflicts with other apps)
#   Ctrl+F12     (Safe function key)
#   F12          (Avro legacy style)
#   Alt+\        (Alt + Backslash)
#   Ctrl+Space   (Note: may conflict with code editors)
shortcut = Ctrl+\

# Audio beep confirmation when switching language (true / false)
sound = false

# Typing style:
#   Classic = Supports typing pre-base Kars before Consonant (ি + ক = কি) as well as Modern
#   Modern  = Pure Unicode style (ক + ি = কি)
typing_style = Classic

# Run silently in background without console window (true / false)
start_hidden = true

# Remember language independently per application window (true / false)
#   true  = Each app remembers its own language (e.g. Word=বাংলা, Chrome=English).
#           New apps safely open in English. (Recommended)
#   false = Single global mode across all applications.
per_window_mode = true

# Sleek on-screen floating "BN" / "EN" badge near typing cursor (true / false)
osd_badge = true

# Smart Coding Mode for IDEs like Antigravity, VS Code, Cursor, Android Studio (true / false)
#   true  = Keeps digits (0-9) and code symbols in English inside IDEs, and automatically
#           switches back to English when clicking into the code editor, switching file tabs,
#           or pressing Enter after sending an AI chat message. (Recommended)
#   false = Manual language switching only.
smart_coding_mode = true
